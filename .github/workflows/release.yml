name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Validate tag and release metadata
        run: |
          node scripts/validate-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --notes-output "$RUNNER_TEMP/release-notes.md"

          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error title=Invalid release tag::The tag must point to a commit in the main branch history."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Validate release package
        run: |
          node scripts/validate-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --archive package.zip
          git diff --check
          sha256sum package.zip > package.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)

          if [[ "$release_state" == "false" ]]; then
            mkdir -p "$RUNNER_TEMP/release-readback"
            gh release download "$GITHUB_REF_NAME" \
              --pattern package.zip \
              --dir "$RUNNER_TEMP/release-readback"
            remote_hash=$(sha256sum "$RUNNER_TEMP/release-readback/package.zip" | cut -d " " -f 1)
            local_hash=$(cut -d " " -f 1 package.zip.sha256)
            if [[ "$remote_hash" != "$local_hash" ]]; then
              echo "::error title=Published release differs::The existing package.zip does not match this build."
              exit 1
            fi
            echo "Release $GITHUB_REF_NAME is already published with the expected package."
            exit 0
          fi

          if [[ "$release_state" != "true" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "Stillmark Workbench ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          gh release upload "$GITHUB_REF_NAME" package.zip package.zip.sha256 --clobber

          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$GITHUB_REF_NAME" \
            --pattern package.zip \
            --dir "$RUNNER_TEMP/release-readback"
          remote_hash=$(sha256sum "$RUNNER_TEMP/release-readback/package.zip" | cut -d " " -f 1)
          local_hash=$(cut -d " " -f 1 package.zip.sha256)
          if [[ "$remote_hash" != "$local_hash" ]]; then
            echo "::error title=Release verification failed::The uploaded package.zip checksum does not match."
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --draft=false
